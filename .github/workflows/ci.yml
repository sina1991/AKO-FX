name: demo-acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q ako_fx scripts
      - run: bash -n install.sh scripts/installer_smoke.sh
      - run: AKO_DOMAIN=demo.example.com docker compose config --quiet
      - run: docker build -t ako-fx:ci .
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: PYTHONPATH=. python tests/browser_acceptance.py
      - run: PYTHONPATH=. python tests/browser_workspace.py
  installer-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install alongside an existing TLS website and repeat without data loss
        run: sudo --preserve-env=GITHUB_ACTIONS bash scripts/installer_smoke.sh
      - name: Installer diagnostics
        if: failure()
        run: |
          sudo cat /etc/ako-fx/install.json 2>/dev/null || true
          sudo docker ps -a
          sudo nginx -t || true
          sudo journalctl -u nginx -n 40 --no-pager
          if [ -f /etc/ako-fx/compose.json ]; then
            sudo docker compose -p ako-fx -f /etc/ako-fx/compose.json logs --tail=50
          fi
