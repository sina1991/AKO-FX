name: demo-acceptance
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q ako_fx
      - run: AKO_DOMAIN=demo.example.com docker compose config --quiet
      - run: docker build -t ako-fx:ci .
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - run: PYTHONPATH=. python tests/browser_acceptance.py
